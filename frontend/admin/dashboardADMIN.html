<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGCMI Dashboard</title>
    <link rel="stylesheet" href="../styles/dashboardADMIN.css">
</head>

<body>

    <div class="container">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar" aria-label="Menú lateral de navegación">

            <div class="logo">
                <span class="logo-text">SIGCMI</span>

                <button id="toggleBtn" aria-label="Abrir o cerrar menú">
                    ☰
                </button>
            </div>

            <hr class="line-1" aria-hidden="true">

            <div class="user" aria-label="Información del usuario">
                <p>Bienvenido</p>
                <h4>montoyajuanes11</h4>
                <span>Administrador</span>
            </div>

            <hr class="line-2" aria-hidden="true">

            <nav aria-label="Opciones principales">
                <a href="#" class="active" aria-label="Ir al Dashboard">
                    <img src="../imgSIGCMI/img/CDCFerriere-removebg-preview (1) 36.png" class="ferriere"
                        alt="Icono Dashboard">
                    <span>Dashboard</span>
                </a>

                <a href="#" aria-label="Ir a Citas">
                    <img src="../imgSIGCMI/img/Calendar.png" alt="Icono Citas">
                    <span>Citas</span>
                </a>

                <a href="#" aria-label="Ir a Pacientes">
                    <img src="../imgSIGCMI/img/Users.png" alt="Icono Pacientes">
                    <span>Pacientes</span>
                </a>

                <a href="#" aria-label="Ir a Médicos">
                    <img src="../imgSIGCMI/img/image_86.png" alt="Icono Médicos">
                    <span>Médicos</span>
                </a>

                <a href="#" aria-label="Ir a WhatsApp">
                    <img src="../imgSIGCMI/img/chat_bubble.png" alt="Icono WhatsApp">
                    <span>WhatsApp</span>
                </a>
            </nav>

            <hr class="line-3" aria-hidden="true">

            <div class="logout" role="button" tabindex="0" aria-label="Cerrar sesión">
                <img src="../imgSIGCMI/img/Logout.png" class="log-out" alt="Icono cerrar sesión">
                <span class="sesionlogout">Cerrar Sesión</span>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main">

            <!-- HEADER -->
            <header class="header">
                <h1 aria-label="Sistema Integral de Gestión de Citas Médicas ">Sistema Integral de Gestión de Citas
                    Médicas</h1>
                <span aria-label="martes, 7 de abril de 2026">martes, 7 de abril de 2026</span>
            </header>

            <!-- CARDS -->
            <section class="cards">
                <div class="card">
                    <p aria-label="Cistas de Hoy">Citas Hoy</p>
                    <div>
                        <h2>24</h2>
                        <img src="../imgSIGCMI/img/blueCalendar.png" alt="Imagen de Calendario">
                    </div>
                </div>
                <div class="card">
                    <p aria-label="Pacientes Activos">Pacientes Activos</p>
                    <div>
                        <h2>1248</h2>
                        <img src="../imgSIGCMI/img/usderGreen.png" alt="Imagen de Pacientes Activos">
                    </div>
                </div>
                <div class="card">
                    <p>Médicos Disponibles</p>
                    <div>
                        <h2>18</h2>
                        <img src="../imgSIGCMI/img/historyUser.png" alt="Imagen de Historias de Usuario">
                    </div>
                </div>
                <div class="card">
                    <p>Tiempo Promedio</p>
                    <div>
                        <h2>15 min</h2>
                        <img src="../imgSIGCMI/img/clockUserADMIN.png" alt="Imagen de timpo promedio de consulta">
                    </div>
                </div>
            </section>

            

        </main>
    </div>



    <script src="../javascript/dashboardADMIN.js"></script>
</body>

</html>
