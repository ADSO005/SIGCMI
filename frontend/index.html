<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SIGCMI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="minHeader">
                <h1>SIGCMI</h1>
                <p>Sistema Integral de Gestión<br>de Citas Médicas</p>
            </div>
            <img src="img/CurvaTerrestre.png" alt="">
        </div>

        <div class="tarjeta">
            <h2>Iniciar Sesión</h2>
            <p class="subtitulo">Ingresa a tu cuenta para continuar</p>

            <form>
                <label>Correo Electronico*</label>
                <div class="input-box">
                    <img src="img/email.svg" class="icon" alt="email">
                    <input type="email" placeholder="correro@ejemplo.com">
                </div>

                <label>Contraseña*</label>
                <div class="input-box">
                    <img src="img/lock.svg" class="icon" alt="contraseña">
                    <input type="password" placeholder="*********">
                </div>

            </form>

        </div>



    </div>

</body>

</html>
